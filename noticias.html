<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Noticias — Combo Mix</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>🍿</text></svg>"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .noticias-container { padding: 0 5% 80px; }
    .noticias-list {
      display: flex; flex-direction: column;
      border: 1.5px solid var(--gris-linea); margin-top: 40px;
    }
    .noticia-item {
      display: grid; grid-template-columns: 48px 1fr auto;
      align-items: center; gap: 24px; padding: 28px;
      border-bottom: 1px solid var(--gris-linea);
      cursor: pointer; transition: background 0.2s; text-decoration: none; color: inherit;
    }
    .noticia-item:last-child { border-bottom: none; }
    .noticia-item:hover { background: rgba(245,200,66,0.04); }
    .noticia-num {
      font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem;
      color: var(--gris-linea); text-align: right; line-height: 1;
    }
    .noticia-titulo { font-weight: 500; font-size: 1rem; line-height: 1.4; margin-bottom: 4px; }
    .noticia-preview { font-size: 0.82rem; color: var(--gris); line-height: 1.5; }
    .noticia-fecha { font-size: 0.72rem; color: var(--gris); margin-top: 6px; }
    .noticia-tag {
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--amarillo);
      background: rgba(245,200,66,0.1); padding: 4px 10px; white-space: nowrap;
      align-self: flex-start;
    }
    @media (max-width: 600px) {
      .noticia-item { grid-template-columns: 36px 1fr; }
      .noticia-tag { display: none; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <img src="imagenes/COMBO_MIX_LOGO.png" alt="Combo Mix logo"/>
    <span class="nav-logo-text">COMBO MIX</span>
  </a>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Inicio</a></li>
    <li><a href="resenas.html">Reseñas</a></li>
    <li><a href="noticias.html">Noticias</a></li>
    <li><a href="festivales.html">Festivales</a></li>
    <li><a href="cartelera.html">Cartelera</a></li>
    <li><a href="equipo.html">Equipo</a></li>
    <li><a href="contacto.html">Contacto</a></li>
  </ul>
  <button class="nav-hamburger" id="hamburger" aria-label="Menú">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="page">
  <div class="page-hero">
    <span class="section-label">Noticias</span>
    <h1>LO QUE<br>PASA</h1>
  </div>
  <div class="noticias-container">
    <div class="noticias-list" id="noticiasList"></div>
  </div>
</div>

<footer>
  <span class="footer-brand">COMBO MIX</span>
  <span class="footer-copy">© 2026 Combo Mix · Proyecto escolar · Todos los derechos reservados</span>
</footer>

<script src="datos.js"></script>
<script src="nav.js"></script>
<script>
  const list = document.getElementById('noticiasList');
  NOTICIAS.forEach((n, i) => {
    list.innerHTML += `
      <a class="noticia-item" href="noticia.html?id=${n.id}">
        <span class="noticia-num">${String(i+1).padStart(2,'0')}</span>
        <div>
          <div class="noticia-titulo">${n.titulo}</div>
          <div class="noticia-preview">${n.contenido.substring(0, 120)}…</div>
          <div class="noticia-fecha">${n.fecha}</div>
        </div>
        <span class="noticia-tag">${n.categoria}</span>
      </a>`;
  });
</script>
</body>
</html>
