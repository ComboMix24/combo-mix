<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Festivales — Combo Mix</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>🍿</text></svg>"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .festivales-container { padding: 40px 5% 80px; }
    .filtros {
      display: flex; gap: 10px; margin-bottom: 2rem; flex-wrap: wrap;
    }
    .filtro-btn {
      padding: 8px 20px; border: 1px solid var(--gris-linea);
      background: none; color: var(--gris); font-size: 0.78rem;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
      cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif;
    }
    .filtro-btn:hover, .filtro-btn.activo {
      border-color: var(--amarillo); color: var(--amarillo);
      background: rgba(245,200,66,0.08);
    }
    .festivales-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5px; background: var(--gris-linea); border: 1.5px solid var(--gris-linea);
    }
    .festival-card {
      background: var(--negro-card); padding: 32px 28px;
      display: flex; flex-direction: column; gap: 10px;
      position: relative; overflow: hidden; transition: background 0.2s;
    }
    .festival-card::after {
      content: ''; position: absolute; bottom: 0; left: 0;
      height: 2px; width: 0; background: var(--amarillo); transition: width 0.3s;
    }
    .festival-card:hover { background: #222; }
    .festival-card:hover::after { width: 100%; }
    .festival-cat {
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--negro);
      background: var(--amarillo); padding: 3px 10px;
      display: inline-block; width: fit-content;
    }
    .festival-nombre {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem; letter-spacing: 0.02em; line-height: 1.1;
    }
    .festival-lugar { font-size: 0.8rem; color: var(--amarillo); font-weight: 500; }
    .festival-fecha { font-size: 0.78rem; color: var(--gris); }
    .festival-desc { font-size: 0.84rem; color: #aaa; line-height: 1.65; margin-top: 4px; }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <img src="imagenes/COMBO_MIX_LOGO.png" alt="Combo Mix logo"/>
    <span class="nav-logo-text">COMBO MIX</span>
  </a>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Inicio</a></li>
    <li><a href="resenas.html">Reseñas</a></li>
    <li><a href="noticias.html">Noticias</a></li>
    <li><a href="festivales.html">Festivales</a></li>
    <li><a href="cartelera.html">Cartelera</a></li>
    <li><a href="equipo.html">Equipo</a></li>
    <li><a href="contacto.html">Contacto</a></li>
  </ul>
  <button class="nav-hamburger" id="hamburger" aria-label="Menú">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="page">
  <div class="page-hero" style="background-image: url('imagenes/portada-festivales.jpg'); background-size: cover; background-position: center;">
    <span class="section-label">Festivales</span>
    <h1>EN EL<br>CIRCUITO</h1>
  </div>
  <div class="festivales-container">
    <div class="filtros">
      <button class="filtro-btn activo" onclick="filtrar('Todos', this)">Todos</button>
      <button class="filtro-btn" onclick="filtrar('México', this)">México</button>
      <button class="filtro-btn" onclick="filtrar('Internacional', this)">Internacional</button>
    </div>
    <div class="festivales-grid" id="festivalesGrid"></div>
  </div>
</div>

<footer>
  <span class="footer-brand">COMBO MIX</span>
  <span class="footer-copy">© 2026 Combo Mix · Proyecto escolar · Todos los derechos reservados</span>
</footer>

<script src="datos.js"></script>
<script src="nav.js"></script>
<script>
  function renderFestivales(filtro) {
    const grid = document.getElementById('festivalesGrid');
    const lista = filtro === 'Todos' ? FESTIVALES : FESTIVALES.filter(f => f.categoria === filtro);
    grid.innerHTML = lista.map(f => `
      <div class="festival-card">
        <span class="festival-cat">${f.categoria}</span>
        <span class="festival-nombre">${f.nombre}</span>
        <span class="festival-lugar">📍 ${f.lugar}</span>
        <span class="festival-fecha">🗓 ${f.fecha}</span>
        <p class="festival-desc">${f.descripcion}</p>
      </div>`).join('');
  }

  function filtrar(cat, btn) {
    document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('activo'));
    btn.classList.add('activo');
    renderFestivales(cat);
  }

  renderFestivales('Todos');
</script>
</body>
</html>
