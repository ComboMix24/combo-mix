<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Reseñas — Combo Mix</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>🍿</text></svg>"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .resenas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.5px; background: var(--gris-linea); border: 1.5px solid var(--gris-linea);
      margin: 40px 5% 0;
    }
    .resena-card {
      background: var(--negro-card); padding: 28px;
      display: flex; flex-direction: column; gap: 10px;
      text-decoration: none; color: inherit;
      transition: background 0.2s; position: relative; overflow: hidden;
    }
    .resena-card::after {
      content: ''; position: absolute; bottom: 0; left: 0;
      height: 2px; width: 0; background: var(--amarillo); transition: width 0.3s;
    }
    .resena-card:hover { background: #222; }
    .resena-card:hover::after { width: 100%; }
    .resena-genero { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--amarillo); }
    .resena-titulo { font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem; letter-spacing: 0.02em; line-height: 1.1; }
    .resena-director { font-size: 0.78rem; color: var(--gris); }
    .resena-desc { font-size: 0.84rem; color: #aaa; line-height: 1.65; }
    .resena-rating { margin-top: auto; display: flex; align-items: center; gap: 8px; }
    .stars { color: var(--amarillo); font-size: 0.85rem; letter-spacing: 2px; }
    .rating-num { font-size: 0.75rem; color: var(--gris); }
    .resena-leer {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--amarillo); opacity: 0; transition: opacity 0.2s;
    }
    .resena-card:hover .resena-leer { opacity: 1; }
    .page-content { padding-bottom: 80px; }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <img src="imagenes/COMBO_MIX_LOGO.png" alt="Combo Mix logo"/>
    <span class="nav-logo-text">COMBO MIX</span>
  </a>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Inicio</a></li>
    <li><a href="resenas.html">Reseñas</a></li>
    <li><a href="noticias.html">Noticias</a></li>
    <li><a href="festivales.html">Festivales</a></li>
    <li><a href="cartelera.html">Cartelera</a></li>
    <li><a href="equipo.html">Equipo</a></li>
    <li><a href="contacto.html">Contacto</a></li>
  </ul>
  <button class="nav-hamburger" id="hamburger" aria-label="Menú">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="page page-content">
  <div class="page-hero" style="background-image: url('imagenes/portada-resenas.jpg'); background-size: cover; background-position: center;">
    <span class="section-label">Reseñas</span>
    <h1>LO QUE<br>VIMOS</h1>
  </div>
  <div class="resenas-grid" id="resenasGrid"></div>
</div>

<footer>
  <span class="footer-brand">COMBO MIX</span>
  <span class="footer-copy">© 2026 Combo Mix · Proyecto escolar · Todos los derechos reservados</span>
</footer>

<script src="datos.js"></script>
<script src="nav.js"></script>
<script>
  const grid = document.getElementById('resenasGrid');
  const estrellas = n => '★'.repeat(n) + '☆'.repeat(5 - n);
  RESENAS.forEach(r => {
grid.innerHTML += `
      <a class="resena-card" href="resena.html?id=${r.id}" style="position:relative;overflow:hidden;">
        ${r.poster ? `<img src="${r.poster}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.15;"/>` : ''}
        <span class="resena-genero" style="position:relative">${r.genero} · ${r.año}</span>
        <span class="resena-titulo" style="position:relative">${r.titulo}</span>
        <span class="resena-director">Dir. ${r.director}</span>
        <p class="resena-desc">${r.resumen}</p>
        <div class="resena-rating">
          <span class="stars">${estrellas(r.estrellas)}</span>
          <span class="rating-num">${r.calificacion} / 5</span>
        </div>
        <span class="resena-leer">Leer reseña completa →</span>
      </a>`;
  });
</script>
</body>
</html>
