<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Reseña — Combo Mix</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>🍿</text></svg>"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .resena-page { padding: 60px 5% 80px; max-width: 820px; }
    .resena-back {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--gris); font-size: 0.8rem; text-decoration: none;
      letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500;
      margin-bottom: 2.4rem; transition: color 0.2s;
    }
    .resena-back:hover { color: var(--amarillo); }
    .resena-genero-badge {
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.12em; color: var(--amarillo);
      border-left: 3px solid var(--amarillo); padding-left: 10px;
      display: block; margin-bottom: 1rem;
    }
    .resena-titulo-grande {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: 0.92; letter-spacing: 0.02em; margin-bottom: 1rem;
    }
    .resena-meta {
      display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
      padding-bottom: 1.6rem; border-bottom: 1px solid var(--gris-linea);
      margin-bottom: 2rem;
    }
    .resena-meta-item { font-size: 0.82rem; color: var(--gris); }
    .resena-meta-item span { color: var(--blanco); }
    .stars-grande { color: var(--amarillo); font-size: 1.1rem; letter-spacing: 3px; }
    .resena-calificacion {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.4rem; color: var(--amarillo); line-height: 1;
    }
    .resena-cuerpo {
      font-size: 1rem; color: #ccc; line-height: 1.9;
    }
    .resena-cuerpo p + p { margin-top: 1.2rem; }
    .resena-cuerpo em { color: var(--blanco); font-style: italic; }
    .not-found {
      padding: 60px 5%; text-align: center;
    }
    .not-found h2 {
      font-family: 'Bebas Neue', sans-serif; font-size: 3rem; color: var(--gris);
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <img src="imagenes/COMBO_MIX_LOGO.png" alt="Combo Mix logo"/>
    <span class="nav-logo-text">COMBO MIX</span>
  </a>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Inicio</a></li>
    <li><a href="resenas.html">Reseñas</a></li>
    <li><a href="noticias.html">Noticias</a></li>
    <li><a href="festivales.html">Festivales</a></li>
    <li><a href="cartelera.html">Cartelera</a></li>
    <li><a href="equipo.html">Equipo</a></li>
    <li><a href="contacto.html">Contacto</a></li>
  </ul>
  <button class="nav-hamburger" id="hamburger" aria-label="Menú">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="page" id="contenido"></div>

<footer>
  <span class="footer-brand">COMBO MIX</span>
  <span class="footer-copy">© 2026 Combo Mix · Proyecto escolar · Todos los derechos reservados</span>
</footer>

<!-- Librerías oficiales de Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script src="datos.js"></script>
<script src="nav.js"></script>
<script>
  // ── CONFIGURACIÓN DE FIREBASE ──
  const firebaseConfig = {
    apiKey: "AIzaSyBumMPRO-LPLQYjlit5x_SmWMD46sUEjck",
    authDomain: "combo-mix-667a3.firebaseapp.com",
    projectId: "combo-mix-667a3",
    storageBucket: "combo-mix-667a3.firebasestorage.app",
    messagingSenderId: "162717962081",
    appId: "1:162717962081:web:7180d4df13d1377d2e3f20"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ── RENDERIZADO DE LA PÁGINA ──
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const resena = RESENAS.find(r => String(r.id) === String(id));
  const contenido = document.getElementById('contenido');
  const estrellas = n => '★'.repeat(Number(n) || 0) + '☆'.repeat(Math.max(0, 5 - (Number(n) || 0)));

  if (!resena) {
    contenido.innerHTML = `
      <div class="not-found">
        <h2>Reseña no encontrada</h2>
        <p style="color:var(--gris);margin-top:1rem">La reseña que buscas no existe.</p>
        <a href="resenas.html" class="btn-primary" style="margin-top:2rem;display:inline-block">Ver todas las reseñas</a>
      </div>`;
  } else {
    document.title = `${resena.titulo} — Combo Mix`;
    const notaCalificacion = resena.calificacion || resena.estrellas || 0;

    contenido.innerHTML = `
      <div class="resena-page">
        <a href="resenas.html" class="resena-back">← Volver a reseñas</a>
        ${resena.poster ? `<img src="${resena.poster}" alt="${resena.titulo}" style="width:100%;max-height:450px;object-fit:contain;background-color:var(--negro-card);height:auto;display:block;margin:0 auto 2rem auto;border-radius:4px;"/>` : ''}
        <span class="resena-genero-badge">${resena.genero} · ${resena.año}</span>
        <h1 class="resena-titulo-grande">${resena.titulo}</h1>
        <div class="resena-meta">
          <div>
            <span class="stars-grande">${estrellas(resena.estrellas)}</span>
          </div>
          <span class="resena-calificacion">${notaCalificacion}<span style="font-size:1rem;color:var(--gris)">/5</span></span>
          <div class="resena-meta-item">Director <span>${resena.director}</span></div>
          <div class="resena-meta-item">Año <span>${resena.año}</span></div>
          <div class="resena-meta-item">Género <span>${resena.genero}</span></div>
          ${resena.corresponsal ? `<div class="resena-meta-item">Corresponsal <span>${resena.corresponsal}</span></div>` : ''}
        </div>
        <div class="resena-cuerpo">${resena.texto}</div>

        <!-- SECCIÓN DE INTERACCIÓN: LIKES Y COMENTARIOS -->
        <section class="interaction-container">
          <div class="like-section">
            <button id="likeBtn" class="like-button" onclick="toggleLike('${id}')">
              <span class="like-icon">♥</span>
              <span class="like-text">Me gusta</span>
              <span id="likeCount" class="like-counter">0</span>
            </button>
          </div>

          <hr class="divider">

          <div class="comments-section">
            <h3 class="comments-title">Comentarios (<span id="commentsCount">0</span>)</h3>

            <form id="commentForm" class="comment-form" onsubmit="agregarComentario(event, '${id}')">
              <input type="text" id="authorInput" placeholder="Tu nombre..." required class="input-field">
              <textarea id="commentInput" rows="3" placeholder="Deja tu comentario sobre la película..." required class="input-field textarea-field"></textarea>
              <button type="submit" class="submit-comment-btn">Publicar comentario</button>
            </form>

            <div id="commentsList" class="comments-list"></div>
          </div>
        </section>

      </div>`;

    inicializarInteraccion(id);
  }

  // ── SINCRONIZACIÓN EN TIEMPO REAL CON FIRESTORE ──

  function inicializarInteraccion(resenaId) {
    const idLimpio = String(resenaId);
    const docRef = db.collection('resenas').doc(idLimpio);

    // 1. Escuchar Likes globales en tiempo real
    docRef.onSnapshot((doc) => {
      const data = doc.data();
      const count = (data && data.likes) ? Math.max(0, data.likes) : 0;
      const likeCountEl = document.getElementById('likeCount');
      if (likeCountEl) likeCountEl.textContent = count;
    });

    // Estado visual del botón en este dispositivo
    const userLikeKey = 'combo_resena_user_liked_' + idLimpio;
    const userDioLike = localStorage.getItem(userLikeKey) === 'true';
    const likeBtn = document.getElementById('likeBtn');
    if (userDioLike && likeBtn) likeBtn.classList.add('liked');

    // 2. Escuchar Comentarios globales en tiempo real
    docRef.collection('comentarios').orderBy('timestamp', 'desc').onSnapshot((snapshot) => {
      const countEl = document.getElementById('commentsCount');
      const list = document.getElementById('commentsList');

      if (countEl) countEl.textContent = snapshot.size;
      if (!list) return;

      list.innerHTML = '';
      snapshot.forEach((doc) => {
        const c = doc.data();
        insertarComentarioEnDOM(c.autor, c.texto, c.fecha);
      });
    }, (error) => {
      console.error("Error al escuchar comentarios:", error);
    });
  }

  async function toggleLike(resenaId) {
    const idLimpio = String(resenaId);
    const userLikeKey = 'combo_resena_user_liked_' + idLimpio;
    let userDioLike = localStorage.getItem(userLikeKey) === 'true';

    const docRef = db.collection('resenas').doc(idLimpio);
    const likeBtn = document.getElementById('likeBtn');

    if (!userDioLike) {
      userDioLike = true;
      localStorage.setItem(userLikeKey, 'true');
      if (likeBtn) likeBtn.classList.add('liked');

      await docRef.set({
        likes: firebase.firestore.FieldValue.increment(1)
      }, { merge: true });
    } else {
      userDioLike = false;
      localStorage.setItem(userLikeKey, 'false');
      if (likeBtn) likeBtn.classList.remove('liked');

      await docRef.set({
        likes: firebase.firestore.FieldValue.increment(-1)
      }, { merge: true });
    }
  }

  async function agregarComentario(event, resenaId) {
    event.preventDefault();
    const idLimpio = String(resenaId);
    const autorInput = document.getElementById('authorInput');
    const comentarioInput = document.getElementById('commentInput');

    const nombre = autorInput.value.trim() || 'Anónimo';
    const texto = comentarioInput.value.trim();

    if (!texto) return;

    const ahora = new Date();
    const opciones = { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' };
    const fechaTexto = ahora.toLocaleDateString('es-MX', opciones);

    try {
      await db.collection('resenas').doc(idLimpio).collection('comentarios').add({
        autor: nombre,
        texto: texto,
        fecha: fechaTexto,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      autorInput.value = '';
      comentarioInput.value = '';
    } catch (e) {
      console.error("Error al publicar en Firebase:", e);
      alert("Hubo un detalle al enviar el comentario.");
    }
  }

  function insertarComentarioEnDOM(autor, texto, fecha) {
    const list = document.getElementById('commentsList');
    if (!list) return;

    const nombreSeguro = String(autor || 'Anónimo');
    const inicial = nombreSeguro.charAt(0).toUpperCase() || '?';

    const item = document.createElement('div');
    item.className = 'comment-item';
    item.innerHTML = `
      <div class="comment-avatar">${inicial}</div>
      <div class="comment-content">
        <div class="comment-header">
          <strong class="comment-author">${nombreSeguro}</strong>
          <span class="comment-date">${fecha || 'Hace un momento'}</span>
        </div>
        <p class="comment-text">${texto}</p>
      </div>
    `;

    list.appendChild(item);
  }
</script>
