<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Noticia — Combo Mix</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>🍿</text></svg>"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .noticia-page { padding: 60px 5% 80px; max-width: 760px; }
    .noticia-back {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--gris); font-size: 0.8rem; text-decoration: none;
      letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500;
      margin-bottom: 2rem; transition: color 0.2s;
    }
    .noticia-back:hover { color: var(--amarillo); }
    .noticia-cat {
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.12em; color: var(--amarillo);
      border-left: 3px solid var(--amarillo); padding-left: 10px;
      display: block; margin-bottom: 1rem;
    }
    .noticia-titulo-grande {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1; letter-spacing: 0.02em; margin-bottom: 1rem;
    }
    .noticia-fecha-grande {
      font-size: 0.8rem; color: var(--gris);
      padding-bottom: 1.6rem; border-bottom: 1px solid var(--gris-linea); margin-bottom: 2rem;
    }
    .noticia-cuerpo { font-size: 1rem; color: #ccc; line-height: 1.9; }
    .noticia-cuerpo p + p { margin-top: 1.2rem; }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <img src="imagenes/COMBO_MIX_LOGO.png" alt="Combo Mix logo"/>
    <span class="nav-logo-text">COMBO MIX</span>
  </a>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Inicio</a></li>
    <li><a href="resenas.html">Reseñas</a></li>
    <li><a href="noticias.html">Noticias</a></li>
    <li><a href="festivales.html">Festivales</a></li>
    <li><a href="cartelera.html">Cartelera</a></li>
    <li><a href="equipo.html">Equipo</a></li>
    <li><a href="contacto.html">Contacto</a></li>
  </ul>
  <button class="nav-hamburger" id="hamburger" aria-label="Menú">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="page" id="contenido"></div>

<footer>
  <span class="footer-brand">COMBO MIX</span>
  <span class="footer-copy">© 2026 Combo Mix · Proyecto escolar · Todos los derechos reservados</span>
</footer>

<!-- Librerías oficiales de Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script src="datos.js"></script>
<script src="nav.js"></script>
<script>
  // ── CONFIGURACIÓN DE FIREBASE ──
  const firebaseConfig = {
    apiKey: "AIzaSyBumMPRO-LPLQYjlit5x_SmWMD46sUEjck",
    authDomain: "combo-mix-667a3.firebaseapp.com",
    projectId: "combo-mix-667a3",
    storageBucket: "combo-mix-667a3.firebasestorage.app",
    messagingSenderId: "162717962081",
    appId: "1:162717962081:web:7180d4df13d1377d2e3f20"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ── RENDERIZADO DE LA PÁGINA ──
  const params = new URLSearchParams(window.location.search);
  const paramId = params.get('id');
  const noticia = NOTICIAS.find(n => String(n.id) === String(paramId));
  const contenido = document.getElementById('contenido');

  if (!noticia) {
    contenido.innerHTML = `<div style="padding:60px 5%;text-align:center"><h2 style="font-family:'Bebas Neue',sans-serif;font-size:3rem;color:var(--gris)">Noticia no encontrada</h2><a href="noticias.html" class="btn-primary" style="margin-top:2rem;display:inline-block">Ver todas las noticias</a></div>`;
  } else {
    document.title = `${noticia.titulo} — Combo Mix`;
    contenido.innerHTML = `
      <div class="noticia-page">
        <a href="noticias.html" class="noticia-back">← Volver a noticias</a>
        <span class="noticia-cat">${noticia.categoria}</span>
        <h1 class="noticia-titulo-grande">${noticia.titulo}</h1>
        <div class="noticia-fecha-grande">
          ${noticia.fecha}${noticia.corresponsal ? ` · Corresponsal: <strong style="color:var(--blanco)">${noticia.corresponsal}</strong>` : ''}
        </div>

        ${noticia.imagen ? `<img src="${noticia.imagen}" alt="${noticia.titulo}" style="width:100%; max-height:420px; object-fit:cover; border-radius:4px; margin-bottom:2rem; border:1px solid var(--gris-linea);"/>` : ''}

        <div class="noticia-cuerpo">${noticia.contenido || noticia.texto}</div>

        <!-- SECCIÓN DE INTERACCIÓN: LIKES Y COMENTARIOS -->
        <section class="interaction-container">
          <div class="like-section">
            <button id="likeBtn" class="like-button" onclick="toggleLike('${paramId}')">
              <span class="like-icon">♥</span>
              <span class="like-text">Me gusta</span>
              <span id="likeCount" class="like-counter">0</span>
            </button>
          </div>

          <hr class="divider">

          <div class="comments-section">
            <h3 class="comments-title">Comentarios (<span id="commentsCount">0</span>)</h3>

            <form id="commentForm" class="comment-form" onsubmit="agregarComentario(event, '${paramId}')">
              <input type="text" id="authorInput" placeholder="Tu nombre..." required class="input-field">
              <textarea id="commentInput" rows="3" placeholder="Deja tu comentario sobre esta noticia..." required class="input-field textarea-field"></textarea>
              <button type="submit" class="submit-comment-btn">Publicar comentario</button>
            </form>

            <div id="commentsList" class="comments-list"></div>
          </div>
        </section>

      </div>`;

    inicializarInteraccion(paramId);
  }

  // ── SINCRONIZACIÓN EN TIEMPO REAL (NOTICIAS EN FIRESTORE) ──

  function inicializarInteraccion(noticiaId) {
    const idLimpio = String(noticiaId);
    const docRef = db.collection('noticias').doc(idLimpio);

    // 1. Escuchar Likes globales en tiempo real
    docRef.onSnapshot((doc) => {
      const data = doc.data();
      const count = (data && data.likes) ? Math.max(0, data.likes) : 0;
      const likeCountEl = document.getElementById('likeCount');
      if (likeCountEl) likeCountEl.textContent = count;
    });

    // Estado visual del botón en este dispositivo
    const userLikeKey = 'combo_noticia_user_liked_' + idLimpio;
    const userDioLike = localStorage.getItem(userLikeKey) === 'true';
    const likeBtn = document.getElementById('likeBtn');
    if (userDioLike && likeBtn) likeBtn.classList.add('liked');

    // 2. Escuchar Comentarios globales en tiempo real
    docRef.collection('comentarios').orderBy('timestamp', 'desc').onSnapshot((snapshot) => {
      const countEl = document.getElementById('commentsCount');
      const list = document.getElementById('commentsList');

      if (countEl) countEl.textContent = snapshot.size;
      if (!list) return;

      list.innerHTML = '';
      snapshot.forEach((doc) => {
        const c = doc.data();
        insertarComentarioEnDOM(c.autor, c.texto, c.fecha);
      });
    }, (error) => {
      console.error("Error al escuchar comentarios de noticia:", error);
    });
  }

  async function toggleLike(noticiaId) {
    const idLimpio = String(noticiaId);
    const userLikeKey = 'combo_noticia_user_liked_' + idLimpio;
    let userDioLike = localStorage.getItem(userLikeKey) === 'true';

    const docRef = db.collection('noticias').doc(idLimpio);
    const likeBtn = document.getElementById('likeBtn');

    if (!userDioLike) {
      userDioLike = true;
      localStorage.setItem(userLikeKey, 'true');
      if (likeBtn) likeBtn.classList.add('liked');

      await docRef.set({
        likes: firebase.firestore.FieldValue.increment(1)
      }, { merge: true });
    } else {
      userDioLike = false;
      localStorage.setItem(userLikeKey, 'false');
      if (likeBtn) likeBtn.classList.remove('liked');

      await docRef.set({
        likes: firebase.firestore.FieldValue.increment(-1)
      }, { merge: true });
    }
  }

  async function agregarComentario(event, noticiaId) {
    event.preventDefault();
    const idLimpio = String(noticiaId);
    const autorInput = document.getElementById('authorInput');
    const comentarioInput = document.getElementById('commentInput');

    const nombre = autorInput.value.trim() || 'Anónimo';
    const texto = comentarioInput.value.trim();

    if (!texto) return;

    const ahora = new Date();
    const opciones = { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' };
    const fechaTexto = ahora.toLocaleDateString('es-MX', opciones);

    try {
      await db.collection('noticias').doc(idLimpio).collection('comentarios').add({
        autor: nombre,
        texto: texto,
        fecha: fechaTexto,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      autorInput.value = '';
      comentarioInput.value = '';
    } catch (e) {
      console.error("Error al publicar en Firebase:", e);
      alert("Hubo un problema al enviar el comentario.");
    }
  }

  function insertarComentarioEnDOM(autor, texto, fecha) {
    const list = document.getElementById('commentsList');
    if (!list) return;

    const nombreSeguro = String(autor || 'Anónimo');
    const inicial = nombreSeguro.charAt(0).toUpperCase() || '?';

    const item = document.createElement('div');
    item.className = 'comment-item';
    item.innerHTML = `
      <div class="comment-avatar">${inicial}</div>
      <div class="comment-content">
        <div class="comment-header">
          <strong class="comment-author">${nombreSeguro}</strong>
          <span class="comment-date">${fecha || 'Hace un momento'}</span>
        </div>
        <p class="comment-text">${texto}</p>
      </div>
    `;

    list.appendChild(item);
  }
</script>

</body>
</html>
