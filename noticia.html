<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Noticia — Combo Mix</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>🍿</text></svg>"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .noticia-page { padding: 60px 5% 80px; max-width: 760px; }
    .noticia-back {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--gris); font-size: 0.8rem; text-decoration: none;
      letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500;
      margin-bottom: 2rem; transition: color 0.2s;
    }
    .noticia-back:hover { color: var(--amarillo); }
    .noticia-cat {
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.12em; color: var(--amarillo);
      border-left: 3px solid var(--amarillo); padding-left: 10px;
      display: block; margin-bottom: 1rem;
    }
    .noticia-titulo-grande {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1; letter-spacing: 0.02em; margin-bottom: 1rem;
    }
    .noticia-fecha-grande {
      font-size: 0.8rem; color: var(--gris);
      padding-bottom: 1.6rem; border-bottom: 1px solid var(--gris-linea); margin-bottom: 2rem;
    }
    .noticia-cuerpo { font-size: 1rem; color: #ccc; line-height: 1.9; }
    .noticia-cuerpo p + p { margin-top: 1.2rem; }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <img src="imagenes/COMBO_MIX_LOGO.png" alt="Combo Mix logo"/>
    <span class="nav-logo-text">COMBO MIX</span>
  </a>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Inicio</a></li>
    <li><a href="resenas.html">Reseñas</a></li>
    <li><a href="noticias.html">Noticias</a></li>
    <li><a href="festivales.html">Festivales</a></li>
    <li><a href="cartelera.html">Cartelera</a></li>
    <li><a href="equipo.html">Equipo</a></li>
    <li><a href="contacto.html">Contacto</a></li>
  </ul>
  <button class="nav-hamburger" id="hamburger" aria-label="Menú">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="page" id="contenido"></div>

<footer>
  <span class="footer-brand">COMBO MIX</span>
  <span class="footer-copy">© 2026 Combo Mix · Proyecto escolar · Todos los derechos reservados</span>
</footer>

<script src="datos.js"></script>
<script src="nav.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const paramId = params.get('id');
  const noticia = NOTICIAS.find(n => String(n.id) === String(paramId));
  const contenido = document.getElementById('contenido');

  if (!noticia) {
    contenido.innerHTML = `<div style="padding:60px 5%;text-align:center"><h2 style="font-family:'Bebas Neue',sans-serif;font-size:3rem;color:var(--gris)">Noticia no encontrada</h2><a href="noticias.html" class="btn-primary" style="margin-top:2rem;display:inline-block">Ver todas las noticias</a></div>`;
  } else {
    document.title = `${noticia.titulo} — Combo Mix`;
    contenido.innerHTML = `
      <div class="noticia-page">
        <a href="noticias.html" class="noticia-back">← Volver a noticias</a>
        <span class="noticia-cat">${noticia.categoria}</span>
        <h1 class="noticia-titulo-grande">${noticia.titulo}</h1>
        <div class="noticia-fecha-grande">
          ${noticia.fecha}${noticia.corresponsal ? ` · Corresponsal: <strong style="color:var(--blanco)">${noticia.corresponsal}</strong>` : ''}
        </div>

        ${noticia.imagen ? `<img src="${noticia.imagen}" alt="${noticia.titulo}" style="width:100%; max-height:420px; object-fit:cover; border-radius:4px; margin-bottom:2rem; border:1px solid var(--gris-linea);"/>` : ''}

        <div class="noticia-cuerpo">${noticia.contenido || noticia.texto}</div>

        <!-- SECCIÓN DE INTERACCIÓN: LIKES Y COMENTARIOS -->
        <section class="interaction-container">
          <div class="like-section">
            <button id="likeBtn" class="like-button" onclick="toggleLike('${paramId}')">
              <span class="like-icon">♥</span>
              <span class="like-text">Me gusta</span>
              <span id="likeCount" class="like-counter">0</span>
            </button>
          </div>

          <hr class="divider">

          <div class="comments-section">
            <h3 class="comments-title">Comentarios (<span id="commentsCount">0</span>)</h3>

            <form id="commentForm" class="comment-form" onsubmit="agregarComentario(event, '${paramId}')">
              <input type="text" id="authorInput" placeholder="Tu nombre..." required class="input-field">
              <textarea id="commentInput" rows="3" placeholder="Deja tu comentario sobre esta noticia..." required class="input-field textarea-field"></textarea>
              <button type="submit" class="submit-comment-btn">Publicar comentario</button>
            </form>

            <div id="commentsList" class="comments-list"></div>
          </div>
        </section>

      </div>`;

      inicializarInteraccion(paramId);
  }

  let liked = false;
  const baseLikes = 0;

  function inicializarInteraccion(noticiaId) {
    const storageLikeKey = 'combo_noticia_like_' + noticiaId;
    const storageCommentsKey = 'combo_noticia_comments_' + noticiaId;

    liked = localStorage.getItem(storageLikeKey) === 'true';
    const likeBtn = document.getElementById('likeBtn');
    const likeCountEl = document.getElementById('likeCount');
    if (liked && likeBtn) {
      likeBtn.classList.add('liked');
      likeCountEl.textContent = baseLikes + 1;
    } else if (likeCountEl) {
      likeCountEl.textContent = baseLikes;
    }

    const guardados = JSON.parse(localStorage.getItem(storageCommentsKey)) || [];
    const countEl = document.getElementById('commentsCount');
    if (countEl) countEl.textContent = guardados.length;

    guardados.forEach(c => {
      insertarComentarioEnDOM(c.autor, c.texto, c.fecha);
    });
  }

  function toggleLike(noticiaId) {
    const storageLikeKey = 'combo_noticia_like_' + noticiaId;
    liked = !liked;
    localStorage.setItem(storageLikeKey, liked);

    const likeBtn = document.getElementById('likeBtn');
    const likeCountEl = document.getElementById('likeCount');
    if (liked) {
      likeBtn.classList.add('liked');
      likeCountEl.textContent = baseLikes + 1;
    } else {
      likeBtn.classList.remove('liked');
      likeCountEl.textContent = baseLikes;
    }
  }

  function agregarComentario(event, noticiaId) {
    event.preventDefault();
    const storageCommentsKey = 'combo_noticia_comments_' + noticiaId;
    const autorInput = document.getElementById('authorInput');
    const comentarioInput = document.getElementById('commentInput');

    const nuevoComentario = {
      autor: autorInput.value.trim(),
      texto: comentarioInput.value.trim(),
      fecha: 'Hace un momento'
    };

    const guardados = JSON.parse(localStorage.getItem(storageCommentsKey)) || [];
    guardados.unshift(nuevoComentario);
    localStorage.setItem(storageCommentsKey, JSON.stringify(guardados));

    insertarComentarioEnDOM(nuevoComentario.autor, nuevoComentario.texto, nuevoComentario.fecha, true);

    const countEl = document.getElementById('commentsCount');
    if (countEl) countEl.textContent = guardados.length;

    autorInput.value = '';
    comentarioInput.value = '';
  }

  function insertarComentarioEnDOM(autor, texto, fecha, alInicio = false) {
    const list = document.getElementById('commentsList');
    const inicial = autor.charAt(0).toUpperCase();

    const item = document.createElement('div');
    item.className = 'comment-item';
    item.innerHTML = `
      <div class="comment-avatar">${inicial}</div>
      <div class="comment-content">
        <div class="comment-header">
          <strong class="comment-author">${autor}</strong>
          <span class="comment-date">${fecha}</span>
        </div>
        <p class="comment-text">${texto}</p>
      </div>
    `;

    if (alInicio) {
      list.prepend(item);
    } else {
      list.appendChild(item);
    }
  }
</script>

</body>
</html>
